<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0b1725" />
  <title>ジェスチャー設定ツール v1.1</title>
  <style>
    :root {
      --bg: #081724;
      --bg-2: #0d1b2b;
      --panel: #14273b;
      --panel-2: #1a2e42;
      --line: #4d6785;
      --line-soft: #6990b7;
      --blue: #1fa0ff;
      --blue-2: #0975e8;
      --green: #15c673;
      --green-2: #09925a;
      --amber: #f7b84f;
      --red: #ec6f6f;
      --text: #edf5ff;
      --muted: #b8ccdf;
      --shadow: rgba(0,0,0,.26);
      --radius: 14px;
    }
    * { box-sizing: border-box; }
    html,body { margin:0; min-height:100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
      background: radial-gradient(circle at 50% -120px, #1a2a3f 0%, #0a1522 42%, #07131f 100%);
      color: var(--text);
      line-height:1.45;
      min-height:100vh;
    }
    button, input, select { font:inherit; }
    button { cursor:pointer; }
    button:disabled { opacity:.45; cursor:not-allowed; }
    button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible { outline: 3px solid #71d7ff; outline-offset:2px; }
    .hidden { display:none !important; }
    main {
      max-width: 1500px;
      margin: 0 auto;
      padding: 16px 14px 42px;
    }
    header {
      display:flex; align-items:center; gap:14px;
      margin: 0 0 16px;
    }
    .brand-icon{ width:52px; height:52px; display:grid; place-items:center; color:#eff6ff; }
    .brand-icon svg{ width:52px; height:52px; }
    h1 { margin:0 0 4px; font-size: clamp(20px, 2.6vw, 33px); line-height:1.2; }
    .lead { margin:0; color: var(--muted); font-size: 13px; }
    .help {
      margin-left:auto; padding: 9px 15px; border: 1px solid #7b8fa6; border-radius: 10px; background:#142734; color: var(--text); font-weight:700;
    }
    .tabbar {
      display:grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap:8px; margin: 0 0 12px;
    }
    .tab {
      min-height: 50px; border: 1px solid #546f89; border-radius: 12px; background: linear-gradient(#1b2d40,#152436); color: var(--text);
      font-weight:800; font-size: 14px; padding: 10px 6px;
    }
    .tab.active {
      background: linear-gradient(180deg, #2ca8fb, #0d75ee);
      border-color: #7ed5ff;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.26);
    }
    .quickbar {
      display:flex; align-items:center; justify-content:space-between; gap:10px;
      padding: 10px 14px; border-radius: 12px; background:#132132; border:1px solid #314b67; margin-bottom: 14px;
      box-shadow: 0 8px 18px rgba(0,0,0,.08);
    }
    .quicktext { color: var(--muted); font-size: 13px; }
    .btn {
      border-radius: 9px; border: 1px solid #738da9; background: linear-gradient(#24384d,#1a2a3b); color: var(--text);
